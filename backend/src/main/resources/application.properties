spring.application.name=backend

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentgrid_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
#spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hikari pool ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=TalentGridHikari

# --- JPA / Hibernate ---
# Flyway owns the schema; JPA validates that mapped columns exist.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# --- Web / server ---
server.port=8080
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20000
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-response-header-size=8KB
server.max-http-request-header-size=8KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.error.include-message=never
server.error.include-stacktrace=never

# --- Spring Data pagination caps ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# --- JWT ---
# For local dev, set APP_JWT_SECRET to any base64 string >= 64 bytes.
# Generate one: `openssl rand -base64 64`. Never commit a real secret.
app.jwt.secret=${APP_JWT_SECRET:CHANGE-ME-generate-a-real-secret-with-openssl-rand-base64-64-and-set-APP_JWT_SECRET-env-var-min-64-bytes}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=${APP_JWT_ISSUER:talentgrid}
app.jwt.audience=${APP_JWT_AUDIENCE:talentgrid-web}

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Admin bootstrap (override in production) ---
# CHANGE APP_ADMIN_PASSWORD in any real environment. The default below is a
# well-known value used only for local development.
app.admin.email=${APP_ADMIN_EMAIL:admin@talentgrid.com}
app.admin.password=${APP_ADMIN_PASSWORD:ChangeMe123!}

# --- Resume storage (swap for S3 in prod) ---
app.resume.storage-dir=${APP_RESUME_STORAGE_DIR:./data/resumes}

# --- Logging ---
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n
logging.level.root=INFO
logging.level.com.talentgrid=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
