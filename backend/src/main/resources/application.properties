spring.application.name=backend

# --- Local overrides ---
# Untracked file for real secrets in dev (APP_JWT_SECRET, DB password, OAuth ids).
# Ignored by git; absent in CI and prod, where real env vars are exported instead.
spring.config.import=optional:file:./local.properties

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentgrid_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hikari pool ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=TalentGridHikari

# --- JPA / Hibernate ---
# Flyway owns the schema; JPA validates that mapped columns exist.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# --- Web / server ---
server.port=8080
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20000
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-response-header-size=8KB
server.max-http-request-header-size=8KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.error.include-message=never
server.error.include-stacktrace=never

# --- Spring Data pagination caps ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# --- JWT ---
# For local dev, set APP_JWT_SECRET to any base64 string >= 64 bytes.
# Generate one: `openssl rand -base64 64`. Never commit a real secret.
app.jwt.secret=${APP_JWT_SECRET:CHANGE-ME-generate-a-real-secret-with-openssl-rand-base64-64-and-set-APP_JWT_SECRET-env-var-min-64-bytes}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=${APP_JWT_ISSUER:talentgrid}
app.jwt.audience=${APP_JWT_AUDIENCE:talentgrid-web}

# --- Frontend base URL (used in e-mails and redirects) ---
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# --- E-mail (password reset, application updates) ---
# Leave SPRING_MAIL_HOST unset and every message is written to the log instead of sent.
# Gmail example: SPRING_MAIL_HOST=smtp.gmail.com SPRING_MAIL_PORT=587
#                SPRING_MAIL_USERNAME=you@gmail.com SPRING_MAIL_PASSWORD=<16-char app password>
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:TalentGrid <no-reply@talentgrid.local>}

# --- Subscription (no payment gateway yet; upgrade activates PRO immediately) ---
app.subscription.free-applications-per-month=${APP_SUBSCRIPTION_FREE_APPLICATIONS:3}
app.subscription.pro-days=${APP_SUBSCRIPTION_PRO_DAYS:30}

# --- Social sign-in (Google / LinkedIn via OpenID Connect) ---
# Register these redirect URIs with each provider:
#   Google:   http://localhost:8080/login/oauth2/code/google
#   LinkedIn: http://localhost:8080/login/oauth2/code/linkedin
# The placeholder defaults let the app boot without credentials; the buttons will
# fail at the provider until the real client id / secret are exported.
app.oauth2.frontend-callback-url=${APP_OAUTH2_FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.linkedin.client-id=${LINKEDIN_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.linkedin.client-name=LinkedIn
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.linkedin.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.linkedin.scope=openid,profile,email
spring.security.oauth2.client.provider.linkedin.authorization-uri=https://www.linkedin.com/oauth/v2/authorization
spring.security.oauth2.client.provider.linkedin.token-uri=https://www.linkedin.com/oauth/v2/accessToken
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/userinfo
spring.security.oauth2.client.provider.linkedin.jwk-set-uri=https://www.linkedin.com/oauth/openid/jwks
spring.security.oauth2.client.provider.linkedin.user-name-attribute=sub

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Admin bootstrap (override in production) ---
# CHANGE APP_ADMIN_PASSWORD in any real environment. The default below is a
# well-known value used only for local development.
app.admin.email=${APP_ADMIN_EMAIL:admin@talentgrid.com}
app.admin.password=${APP_ADMIN_PASSWORD:ChangeMe123!}

# --- Demo data (one full candidate + one verified employer, seeded once) ---
# priya.demo@talentgrid.com / Demo1234!  and  rahul.demo@talentgrid.com / Demo1234!
# Set APP_SEED_DEMO=false in production.
app.demo.seed=${APP_SEED_DEMO:true}

# --- Resume storage (swap for S3 in prod) ---
app.resume.storage-dir=${APP_RESUME_STORAGE_DIR:./data/resumes}

# --- Logging ---
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n
# Per-request access lines come from RequestLoggingFilter; raise to DEBUG to see 2xx traffic too.
app.logging.slow-request-ms=${APP_LOGGING_SLOW_REQUEST_MS:1000}

# Rolling file output. Set APP_LOG_FILE to a path to enable it; console stays on either way.
logging.file.name=${APP_LOG_FILE:}
logging.logback.rollingpolicy.file-name-pattern=${APP_LOG_FILE:}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n

logging.level.root=INFO
logging.level.com.talentgrid=INFO
logging.level.com.talentgrid.backend.security.RequestLoggingFilter=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
